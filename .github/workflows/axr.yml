name: AXR native and security gates
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Windows NT boundary smoke before native build
        if: runner.os == 'Windows'
        run: python scripts/validate_windows_files.py
      - name: Native dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 sqlcipher
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "AXR_SQLCIPHER_LIBRARY=$(brew --prefix sqlcipher)/lib/libsqlcipher.dylib" >> "$GITHUB_ENV"
      - name: Windows dependency cache identity
        if: runner.os == 'Windows'
        id: dependency-id
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $identity = (& vcpkg version | Out-String) + (& $vswhere -latest -property installationVersion | Out-String)
          $digest = [System.Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData([System.Text.Encoding]::UTF8.GetBytes($identity))).ToLower()
          "value=$digest" >> $env:GITHUB_OUTPUT
      - name: Cache Windows dependency builds
        if: runner.os == 'Windows'
        id: windows-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: axr-vcpkg-windows-v2-${{ steps.dependency-id.outputs.value }}
      - name: Native dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows sqlite3:x64-windows nlohmann-json:x64-windows sqlcipher:x64-windows
          "CMAKE_ARGS=-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows" >> $env:GITHUB_ENV
          "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" >> $env:GITHUB_PATH
          "AXR_SQLCIPHER_LIBRARY=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/sqlcipher.dll" >> $env:GITHUB_ENV
      - name: Save completed Windows dependency builds
        if: runner.os == 'Windows' && steps.windows-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: axr-vcpkg-windows-v2-${{ steps.dependency-id.outputs.value }}
      - name: Python and editable C++ SDK
        run: python -m pip install -r requirements.axr.txt -r requirements.security-test.txt pybind11==3.0.1
      - name: Optional SQLite3mc reader (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements.sqlite3mc.txt
      - name: Root helpers and native tests (macOS)
        if: runner.os == 'macOS'
        run: python scripts/build_axr.py --openssl "$OPENSSL_ROOT_DIR" --mac-selection-probe
      - name: Compile read-only native process eligibility probe (macOS)
        if: runner.os == 'macOS'
        run: swiftc adapters/macos/native_runtime_probe.swift -o .local-private/build/wechat-native-runtime-probe
      - name: Build experimental pinned-input proof fixture (macOS)
        if: runner.os == 'macOS'
        run: |
          python scripts/build_pinned_input.py
          python scripts/build_pinned_input.py --navigation
          echo "AXR_TEST_PINNED_INPUT=$PWD/.local-private/build/wechat-pinned-input-experimental" >> "$GITHUB_ENV"
          echo "AXR_TEST_CHAT_NAVIGATION=$PWD/.local-private/build/wechat-chat-navigation-experimental" >> "$GITHUB_ENV"
      - name: Root helpers and native tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\setup.ps1 -AXR -PythonExe (Get-Command python).Source -Toolchain "$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -AXRState "$env:RUNNER_TEMP/AXR install fixture"
          .\.venv\Scripts\python.exe -c "import pathlib,tomllib,axr; c=tomllib.loads(pathlib.Path('codex-axr.toml').read_text(encoding='utf8')); s=c['mcp_servers']['wechat_axr']; assert '--manual-replies' in s['args']; assert pathlib.Path(s['command']).is_file(); assert pathlib.Path('.local-private/build/AXR/Release/axr-owner-auth.exe').is_file()"
      - name: Native sandbox witness path (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "AXR_TEST_WORKER=$PWD/.local-private/build/AXR/axr-worker-probe" >> "$GITHUB_ENV"
          echo "AXR_TEST_RUNTIME_ROOTS=$OPENSSL_ROOT_DIR/lib" >> "$GITHUB_ENV"
          echo "AXR_TEST_KEY_OBSERVER=$PWD/.local-private/build/libwechat-key-observer.dylib" >> "$GITHUB_ENV"
          echo "AXR_TEST_KEY_FIXTURE=$PWD/.local-private/build/wechat-key-fixture" >> "$GITHUB_ENV"
      - name: Build and qualify native WCDB consumer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/build_axr.py --toolchain "$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" --config Release --wechat-native-credentials
          if ($LASTEXITCODE -ne 0) { throw 'Native WCDB consumer build failed' }
          "WECHAT_TEST_WINDOWS_UIA=$env:GITHUB_WORKSPACE/.local-private/build/Release/wechat-uia.exe" >> $env:GITHUB_ENV
          "WECHAT_TEST_WINDOWS_SOURCE=$env:GITHUB_WORKSPACE/.local-private/build/Release/wechat-source-probe.exe" >> $env:GITHUB_ENV
          "WECHAT_TEST_WINDOWS_FRONTEND=$env:GITHUB_WORKSPACE/.local-private/build/Release/wechat-frontend-probe.exe" >> $env:GITHUB_ENV
          $consumer = @(Get-ChildItem -LiteralPath "$env:GITHUB_WORKSPACE/.local-private/build/Release" -Filter '_wechat_credentials*.pyd')
          if ($consumer.Count -ne 1) { throw 'Expected exactly one Windows native WCDB consumer' }
          "WECHAT_TEST_NATIVE_CONSUMER=$($consumer[0].FullName)" >> $env:GITHUB_ENV
          $env:WECHAT_TEST_NATIVE_CONSUMER = $consumer[0].FullName
          python -m unittest test_native_wechat_credentials -q
          if ($LASTEXITCODE -ne 0) { throw 'Native WCDB consumer qualification failed' }
      - name: Formal native credential boundaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/validate_windows_credentials.py --build .local-private/windows-production --library "$env:AXR_SQLCIPHER_LIBRARY" --compile --toolchain "$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          if ($LASTEXITCODE -ne 0) { throw 'Formal native credential validation failed' }
          $env:WECHAT_TEST_FORMAL_BUILD = "$env:GITHUB_WORKSPACE/.local-private/windows-production"
          $env:WECHAT_TEST_REFERENCE_BUILD = "$env:GITHUB_WORKSPACE/.local-private/build"
          "WECHAT_TEST_FORMAL_BUILD=$env:WECHAT_TEST_FORMAL_BUILD" >> $env:GITHUB_ENV
          "WECHAT_TEST_REFERENCE_BUILD=$env:WECHAT_TEST_REFERENCE_BUILD" >> $env:GITHUB_ENV
          python -m unittest test.test_windows_formal_credentials -q
          if ($LASTEXITCODE -ne 0) { throw 'Formal/reference credential regressions failed' }
      - name: Native sandbox witness paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "AXR_TEST_WORKER=$env:GITHUB_WORKSPACE/.local-private/build/AXR/Release/axr-worker-probe.exe" >> $env:GITHUB_ENV
          "AXR_TEST_WINDOWS_LAUNCHER=$env:GITHUB_WORKSPACE/.local-private/build/AXR/Release/axr-sandbox.exe" >> $env:GITHUB_ENV
          "AXR_TEST_RUNTIME_ROOTS=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/debug/bin;$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" >> $env:GITHUB_ENV
      - name: Formal security profile rejects legacy commits
        shell: bash
        run: |
          cmake -S AXR -B .local-private/security-release -DAXR_SECURITY_RELEASE=ON -DAXR_AUTHORITY_HOST=ON -DAXR_PLATFORM_HELPERS=OFF -DBUILD_TESTING=ON $CMAKE_ARGS
          cmake --build .local-private/security-release --config Release --target axr-security-release-tests axr-authority --parallel 4
          ctest --test-dir .local-private/security-release -C Release -R AXRSecurityRelease --output-on-failure
          python scripts/validate_security_host.py .local-private/security-release
      - name: Compile fixed owner control host (Windows)
        if: runner.os == 'Windows'
        run: cmake --build .local-private/security-release --config Release --target axr-owner --parallel 4
      - name: Qt Quick desktop runtime
        run: python -m pip install PySide6-Essentials==6.10.2
      - name: Stage isolated formal Windows authority runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -property installationPath
          $crt = Get-ChildItem -Path "$installation/VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1
          $notice = Get-ChildItem -Path "$installation/Licenses/*/Redist.txt" -File | Select-Object -First 1
          if (-not $crt -or -not $notice) { throw 'Reviewed VC redistributable and notice required' }
          python -m scripts.package_authority_windows --build .local-private/windows-production --dependencies "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" --output "$env:RUNNER_TEMP/windows-formal-authority" --vc-runtime $crt.FullName --vc-notice $notice.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Formal Windows runtime packaging failed' }
          "WECHAT_TEST_FORMAL_PACKAGE=$env:RUNNER_TEMP/windows-formal-authority" >> $env:GITHUB_ENV
      - name: Security and legacy regressions
        run: python -m unittest discover -q
      - name: Desktop 125 and 150 percent render simulation
        shell: bash
        run: |
          QT_SCALE_FACTOR=1.25 python -m unittest test_desktop_ui -q
          QT_SCALE_FACTOR=1.5 python -m unittest test_desktop_ui -q
      - name: Confirm private files are absent
        shell: bash
        run: |
          if git ls-files | grep -E '(^\.local-private/|^\.venv/|\.sqlite3($|-)|\.db$|\.dpapi$|\.sealed\.json$|\.(so|pyd|dylib|dll|exe)$)'; then exit 1; fi
      - name: Package Windows reference runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip wheel --no-deps --wheel-dir "$env:RUNNER_TEMP/axr-runtime-wheels" ./AXR
          if ($LASTEXITCODE -ne 0) { throw 'SDK wheel build failed' }
          python scripts/package_windows_runtime.py --wheels "$env:RUNNER_TEMP/axr-runtime-wheels" --build .local-private/build --dependencies "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" --output "$env:RUNNER_TEMP/windows-axr-runtime" --revision "$env:GITHUB_SHA" --repository "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'Runtime packaging failed' }
      - name: Upload Windows reference runtime
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-axr-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/windows-axr-runtime
          if-no-files-found: error
          retention-days: 7
      - name: Upload account-free formal Windows authority runtime
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-formal-authority-${{ github.sha }}
          path: ${{ runner.temp }}/windows-formal-authority
          if-no-files-found: error
          retention-days: 7

  native-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler and native dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-rt-dev libssl-dev libsqlite3-dev
      - name: Build instrumented policy fuzzer
        run: |
          cmake -S AXR -B .local-private/fuzz -DCMAKE_CXX_COMPILER=clang++ -DAXR_FUZZ=ON -DBUILD_TESTING=OFF -DAXR_PLATFORM_HELPERS=OFF
          cmake --build .local-private/fuzz --target axr-security-fuzz --parallel 4
      - name: Bounded address and undefined behavior fuzz run
        run: .local-private/fuzz/axr-security-fuzz -runs=30000 -max_len=24000 -timeout=3
